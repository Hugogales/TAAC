job_name: "04"

algorithm:
  name: "PPO"

load_model: null

model:
  num_heads: 8                      # Multi-head attention heads (reduced from 4)
  embedding_dim: 64
  hidden_size: 128
  model_name: "lbforaging"        # Base name for saved models

training:
  episodes: 300000                      # Total training episodes (good for testing)
  max_steps_per_episode: 100000
  num_games: 2                    # Number of games per epoch per worker (total steps = max_steps_per_episode * num_games)
  gamma: 0.99                   # Discount factor (higher for delayed tower rewards)
  learning_rate: 2e-5             # Learning rate for Adam optimizer
  epsilon_clip: 0.1                # PPO clipping parameter
  K_epochs: 12                   # PPO update epochs per batch
  c_entropy: 0.004                  # Entropy coefficient for exploration
  max_grad_norm: 200                # Gradient clipping norm
  c_value: 0.5                      # Value function loss coefficient
  lam: 0.99                         # GAE lambda parameter
  batch_size: 512
  min_learning_rate: 1e-6         # Minimum learning rate for scheduler
  similarity_loss_coef: 0.00000        # Cooperation loss (higher = more coordinated behavior)
  similarity_loss_cap: 0.0          # Max cap for similarity loss to prevent instability
  num_parallel: 2                   # Number of parallel environments (1 = single env, 2+ = parallel training)

logging:
  log_interval: 10                  # Print/flush stats every N episodes
  save_interval: 100               # Save a checkpoint every N episodes
  eval_episodes: 100                  # How many episodes to run in eval-only mode
  stats_update_frequency: 50       # How often to flush running stats to disk


environment:
  name: "lbforaging"
  env_kwargs:
    # players: number of agents (alias: num_agents)
    players: 3
    # field_size: grid size (int => square; tuple => (rows, cols))
    field_size: 7
    # max_food: maximum number of food spawned (alias: max_num_food)
    max_food: 6
    # min_player_level/max_player_level: agent level bounds (int or list per-agent)
    max_player_level: 2
    # min_food_level/max_food_level: food level bounds (int or list per-food)
    # min_food_level: 1
    # max_food_level: null
    # sight: vision radius around each agent (only for grid_observation=true)
    sight: 7 
    # max_episode_steps: episode length cap (alias: max_cycles)
    max_episode_steps: 512
    # grid_observation: True => 3x(HxW) tensors; False => flat vectors
    grid_observation: false
    # observe_agent_levels: include agent levels in observations
    observe_agent_levels: true
    # normalize_reward: divide LOAD rewards by coop sum and total spawned food
    normalize_reward: true
    # force_coop: make spawned foods often require cooperation
    force_coop: False
    # penalty: negative reward per failed LOAD attempt
    penalty: 0.0
  apply_wrappers: true
  render_mode: "human"

evaluation:
  models:
    TAAC: files/Models/lbforaging/TAAC/example.pth
  metrics: [reward]
  episodes: 10
  max_steps_per_episode: 200
  num_agents_list: [2, 3, 4]
  render: false


